<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#FFF8F0" />
<title>Slime · Clay + Sound</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-top: #FFF8F0;
    --bg-bot: #FFE8D6;
    --surface: #FFFFFF;
    --surface-soft: #FFF1E0;
    --text: #5C4A3A;
    --text-soft: #A08775;
    --text-hint: #D4B8A0;
    --accent: #FFB088;
    --accent-hover: #FF9166;
    --success: #A8D5A0;
    --r-sm: 16px;
    --r-md: 24px;
    --r-lg: 32px;
    --r-full: 9999px;
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);

    --clay:
      inset 0 4px 8px rgba(255, 255, 255, 0.55),
      inset 0 -4px 8px rgba(180, 140, 100, 0.15),
      0 12px 24px -4px rgba(180, 130, 90, 0.25),
      0 4px 8px -2px rgba(180, 130, 90, 0.15);
    --clay-pressed:
      inset 0 -4px 8px rgba(255, 255, 255, 0.4),
      inset 0 4px 10px rgba(180, 140, 100, 0.28),
      0 2px 4px -1px rgba(180, 130, 90, 0.18);
    --clay-strong:
      inset 0 6px 10px rgba(255, 255, 255, 0.65),
      inset 0 -5px 10px rgba(180, 140, 100, 0.18),
      0 16px 32px -4px rgba(180, 130, 90, 0.32),
      0 6px 12px -2px rgba(180, 130, 90, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
  }
  body {
    font-family: 'Nunito', 'Quicksand', "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 600;
    color: var(--text);
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
    user-select: none; -webkit-user-select: none;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 17% 23%, rgba(255,255,255,0.45) 1px, transparent 2px),
      radial-gradient(circle at 62% 71%, rgba(255,255,255,0.35) 1px, transparent 2px),
      radial-gradient(circle at 81% 12%, rgba(255,255,255,0.40) 1px, transparent 2px),
      radial-gradient(circle at 33% 82%, rgba(255,255,255,0.30) 1px, transparent 2px),
      radial-gradient(circle at 50% 47%, rgba(255,255,255,0.28) 1px, transparent 2px);
    background-size: 53px 53px, 67px 67px, 41px 41px, 73px 73px, 59px 59px;
    opacity: 0.45;
    pointer-events: none;
    z-index: 0;
    mix-blend-mode: overlay;
  }

  .app {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }

  /* Top bar */
  .top {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px 8px;
  }
  .icon-btn {
    width: 48px; height: 48px;
    border-radius: var(--r-full);
    background: var(--surface);
    color: var(--text);
    border: none;
    display: grid; place-items: center;
    cursor: pointer;
    box-shadow: var(--clay);
    transition: transform 0.35s var(--ease-bounce), box-shadow 0.2s ease, color 0.2s ease;
  }
  .icon-btn:active {
    transform: translateY(2px) scale(0.94);
    box-shadow: var(--clay-pressed);
  }
  .icon-btn.toggled {
    color: var(--accent-hover);
    background: var(--surface-soft);
  }
  .icon-btn svg { width: 22px; height: 22px; stroke-width: 2; }
  .top-spacer { flex: 1; }

  /* Stage */
  .stage {
    flex: 1;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
  }
  .stage-inner {
    position: relative;
    width: 280px; height: 280px;
    display: grid; place-items: center;
  }
  .ground-shadow {
    position: absolute;
    bottom: 4px; left: 50%;
    transform: translateX(-50%) scaleX(1);
    width: 210px; height: 32px;
    background: radial-gradient(ellipse at center, rgba(180,130,90,0.35) 0%, rgba(180,130,90,0.18) 35%, transparent 70%);
    filter: blur(2px);
    pointer-events: none;
    transition: transform 0.18s var(--ease-bounce), opacity 0.18s ease;
  }
  .slime {
    width: 280px; height: 280px;
    position: relative;
    display: grid; place-items: center;
    cursor: grab;
    animation: enter 0.6s var(--ease-bounce);
    transition: transform 0.18s var(--ease-bounce);
    will-change: transform;
  }
  .slime:active { cursor: grabbing; }
  .slime svg {
    width: 100%; height: 100%;
    overflow: visible;
    filter:
      drop-shadow(0 14px 22px rgba(180, 130, 90, 0.32))
      drop-shadow(0 6px 10px rgba(180, 130, 90, 0.20));
    pointer-events: none;
  }
  @keyframes enter {
    0%   { transform: scale(0.7); opacity: 0; }
    60%  { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); }
  }

  /* Selector */
  .selector {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 18px 28px 22px;
    scrollbar-width: none;
  }
  .selector::-webkit-scrollbar { display: none; }
  .selector-track {
    display: inline-flex;
    gap: 14px;
    padding: 4px 2px;
  }
  .pick {
    flex-shrink: 0;
    width: 64px; height: 64px;
    border-radius: var(--r-full);
    background: var(--surface);
    border: none;
    cursor: pointer;
    scroll-snap-align: center;
    opacity: 0.72;
    position: relative;
    display: grid; place-items: center;
    overflow: visible;
    box-shadow: var(--clay);
    transition: transform 0.35s var(--ease-bounce), opacity 0.25s ease, box-shadow 0.25s ease;
  }
  .pick:active { transform: scale(0.94); }
  .pick.selected {
    opacity: 1;
    transform: scale(1.10);
    box-shadow: 0 0 0 4px var(--accent), var(--clay-strong);
  }
  .pick .thumb {
    width: 44px; height: 44px;
    border-radius: var(--r-full);
    display: grid; place-items: center;
    box-shadow:
      inset 0 3px 4px rgba(255,255,255,0.5),
      inset 0 -3px 5px rgba(180,140,100,0.18);
  }

  /* Settings sheet — slides up from bottom */
  .sheet-bg {
    position: fixed; inset: 0;
    background: rgba(92, 74, 58, 0.18);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease;
    z-index: 50;
  }
  .sheet-bg.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed;
    left: 50%;
    bottom: 0;
    width: 100%; max-width: 480px;
    transform: translate(-50%, 100%);
    background: linear-gradient(180deg, #FFFCF6 0%, #FFF1E0 100%);
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    box-shadow: 0 -16px 40px rgba(180, 130, 90, 0.25);
    padding: 24px 24px calc(28px + env(safe-area-inset-bottom, 0px));
    transition: transform 0.4s var(--ease-bounce);
    z-index: 60;
  }
  .sheet.show { transform: translate(-50%, 0); }
  .sheet-handle {
    width: 44px; height: 5px;
    background: rgba(180, 130, 90, 0.3);
    border-radius: var(--r-full);
    margin: 0 auto 16px;
  }
  .sheet h3 {
    font-size: 18px; font-weight: 800;
    margin-bottom: 18px;
    letter-spacing: 0.5px;
  }
  .setting-row {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 18px;
    font-size: 14px; font-weight: 700;
  }
  .setting-row > label { min-width: 76px; color: var(--text-soft); }
  .setting-row > input[type="range"] {
    flex: 1; height: 5px;
    accent-color: var(--accent);
  }
  .setting-row .val {
    min-width: 46px; text-align: right;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .setting-row .toggle {
    width: 44px; height: 26px;
    border-radius: var(--r-full);
    background: var(--surface-soft);
    border: none;
    position: relative;
    cursor: pointer;
    box-shadow: var(--clay-pressed);
    transition: background 0.2s;
  }
  .setting-row .toggle::after {
    content: ''; position: absolute;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: white;
    top: 3px; left: 3px;
    box-shadow: 0 2px 4px rgba(180, 130, 90, 0.25);
    transition: transform 0.25s var(--ease-bounce);
  }
  .setting-row .toggle.on { background: var(--accent); }
  .setting-row .toggle.on::after { transform: translateX(18px); }
  .setting-row .status {
    flex: 1; text-align: right;
    font-size: 12px; font-weight: 700;
    color: var(--text-soft);
  }
  .setting-row .status.ok    { color: #5b8c5a; }
  .setting-row .status.warn  { color: #c47a3a; }

  /* Loading mask */
  .loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 248, 240, 0.96);
    z-index: 100;
    font-size: 13px; letter-spacing: 4px; color: var(--text-soft);
    transition: opacity 0.3s;
  }
  .loading.hidden { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<main class="app">

  <header class="top">
    <button class="icon-btn" id="btn-settings" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>

    <div class="top-spacer"></div>

    <button class="icon-btn" id="btn-ambient" aria-label="背景音">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17.5 19a4.5 4.5 0 1 0-1.41-8.775 5.5 5.5 0 0 0-10.802 1.04A4 4 0 0 0 6.5 19h11Z"/>
      </svg>
    </button>

    <button class="icon-btn" id="btn-mute" aria-label="静音">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" id="mute-icon">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07" id="wave-1"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14" id="wave-2"/>
      </svg>
    </button>
  </header>

  <div class="stage">
    <div class="stage-inner">
      <div class="ground-shadow" id="ground-shadow"></div>
      <div class="slime" id="slime"></div>
    </div>
  </div>

  <nav class="selector" id="selector">
    <div class="selector-track" id="selector-track"></div>
  </nav>

</main>

<!-- Settings sheet (master volume + ambient + load status) -->
<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <h3>设置</h3>
  <div class="setting-row">
    <label>主音量</label>
    <input type="range" id="master" min="0" max="100" value="70" />
    <span class="val" id="master-val">70%</span>
  </div>
  <div class="setting-row">
    <label>背景音</label>
    <button class="toggle" id="ambient-toggle" aria-label="切换背景音"></button>
    <span class="status" id="ambient-status">关</span>
  </div>
  <div class="setting-row">
    <label>音效源</label>
    <span class="status" id="s-load">加载中…</span>
  </div>
</div>

<div class="loading" id="loading">加载音效中…</div>

<script>
'use strict';

// =============================================================
// SlimeSoundEngine — Web Audio API (same engine as before)
// =============================================================
class SlimeSoundEngine {
  constructor() {
    const AC = window.AudioContext || window.webkitAudioContext;
    this.audioCtx = new AC();

    this.inputBus = this.audioCtx.createGain();
    this.inputBus.gain.value = 1;

    this.lowpass = this.audioCtx.createBiquadFilter();
    this.lowpass.type = 'lowpass';
    this.lowpass.frequency.value = 8000;

    this.convolver = this.audioCtx.createConvolver();
    this.convolver.buffer = this._makeImpulseResponse(0.3, 2);

    this.dryGain = this.audioCtx.createGain();
    this.dryGain.gain.value = 0.88;
    this.wetGain = this.audioCtx.createGain();
    this.wetGain.gain.value = 0.12;

    this.master = this.audioCtx.createGain();
    this.master.gain.value = 0.7;

    this.inputBus.connect(this.lowpass);
    this.lowpass.connect(this.dryGain);
    this.lowpass.connect(this.convolver);
    this.convolver.connect(this.wetGain);
    this.dryGain.connect(this.master);
    this.wetGain.connect(this.master);
    this.master.connect(this.audioCtx.destination);

    this.buffers = { press: [], release: [], stretch: [], ambient: [] };
    this.lastPlayed = { press: [], release: [] };
    this.loadStatus = [];

    this.pressing = false;
    this.currentIntensity = 0;
    this.pressTimer = null;
    this.stretchSource = null; this.stretchGain = null; this.stretchActive = false;
    this.ambientSource = null; this.ambientGain = null;

    const unlock = () => {
      if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
      document.removeEventListener('touchstart', unlock);
      document.removeEventListener('mousedown', unlock);
    };
    document.addEventListener('touchstart', unlock, { once: true, passive: true });
    document.addEventListener('mousedown', unlock, { once: true });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) this.stopAll();
    });
  }

  _makeImpulseResponse(duration = 0.3, decay = 2) {
    const sr = this.audioCtx.sampleRate;
    const length = Math.max(1, Math.floor(duration * sr));
    const ir = this.audioCtx.createBuffer(2, length, sr);
    for (let ch = 0; ch < 2; ch++) {
      const data = ir.getChannelData(ch);
      for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
    }
    return ir;
  }

  _makeSyntheticBuffer(kind, duration) {
    const sr = this.audioCtx.sampleRate;
    const len = Math.max(1, Math.floor(duration * sr));
    const buf = this.audioCtx.createBuffer(1, len, sr);
    const data = buf.getChannelData(0);
    if (kind === 'press') {
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/len, 2.5) * 0.55;
      this._smoothBuffer(data, 4);
    } else if (kind === 'release') {
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/len, 3.2) * 0.85;
      this._smoothBuffer(data, 2);
    } else if (kind === 'stretch') {
      for (let i = 0; i < len; i++) {
        const flutter = 0.65 + 0.35 * Math.sin(2 * Math.PI * 3.5 * i / sr);
        data[i] = (Math.random() * 2 - 1) * flutter * 0.30;
      }
      this._smoothBuffer(data, 5);
    } else {
      for (let i = 0; i < len; i++) {
        const mod = 0.5 + 0.5 * Math.sin(2 * Math.PI * 0.3 * i / sr);
        data[i] = (Math.random() * 2 - 1) * mod * 0.42;
      }
      this._smoothBuffer(data, 10);
    }
    return buf;
  }

  _smoothBuffer(data, passes) {
    for (let p = 0; p < passes; p++) {
      let prev = data[0];
      for (let i = 1; i < data.length - 1; i++) {
        const cur = data[i];
        data[i] = (prev + cur + data[i + 1]) / 3;
        prev = cur;
      }
    }
  }

  async _loadOne(url, fallbackKind, fallbackDuration) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('http ' + res.status);
      const arr = await res.arrayBuffer();
      const buf = await this.audioCtx.decodeAudioData(arr);
      this.loadStatus.push({ url, ok: true });
      return buf;
    } catch (e) {
      console.warn(`[slime-sound] ${url} missing — using synthetic ${fallbackKind}`, e);
      this.loadStatus.push({ url, ok: false, error: String(e) });
      return this._makeSyntheticBuffer(fallbackKind, fallbackDuration);
    }
  }

  async preloadAll() {
    const pj = [];
    for (let i = 1; i <= 5; i++) pj.push(this._loadOne(`sounds/press/press_0${i}.wav`, 'press', 0.4 + Math.random()*0.3));
    const rj = [];
    for (let i = 1; i <= 4; i++) rj.push(this._loadOne(`sounds/release/release_0${i}.wav`, 'release', 0.15 + Math.random()*0.1));
    const sj = [];
    for (let i = 1; i <= 3; i++) sj.push(this._loadOne(`sounds/stretch/stretch_0${i}.wav`, 'stretch', 1.5));
    const aj = this._loadOne(`sounds/ambient/ambient_loop.wav`, 'ambient', 10);
    const [press, release, stretch, ambient] = await Promise.all([
      Promise.all(pj), Promise.all(rj), Promise.all(sj), aj,
    ]);
    this.buffers.press = press; this.buffers.release = release;
    this.buffers.stretch = stretch; this.buffers.ambient = [ambient];
    this.lastPlayed.press = new Array(press.length).fill(0);
    this.lastPlayed.release = new Array(release.length).fill(0);
  }

  unlock() { if (this.audioCtx.state === 'suspended') this.audioCtx.resume(); }

  _spawn(buffer, { gain = 1, playbackRate = 1, loop = false } = {}) {
    if (!buffer) return null;
    const src = this.audioCtx.createBufferSource();
    src.buffer = buffer;
    src.playbackRate.value = playbackRate;
    src.loop = loop;
    const g = this.audioCtx.createGain();
    g.gain.value = gain;
    src.connect(g); g.connect(this.inputBus);
    src.start();
    return { src, gain: g };
  }

  startPressing() {
    if (this.pressing) return;
    this.pressing = true;
    this._scheduleNextPress();
  }

  _scheduleNextPress() {
    if (!this.pressing) return;
    this._playOnePress();
    const delay = 250 + Math.random() * 150;
    this.pressTimer = setTimeout(() => this._scheduleNextPress(), delay);
  }

  _playOnePress() {
    const pool = this.buffers.press;
    if (!pool.length) return;
    const now = performance.now();
    const fresh = [];
    for (let i = 0; i < pool.length; i++) if (now - this.lastPlayed.press[i] > 200) fresh.push(i);
    const idx = fresh.length ? fresh[Math.floor(Math.random() * fresh.length)] : Math.floor(Math.random() * pool.length);
    this.lastPlayed.press[idx] = now;
    const k = this.currentIntensity;
    this._spawn(pool[idx], { gain: 0.3 + k * 0.5, playbackRate: 1.0 - k * 0.15 });
  }

  updatePressIntensity(deformation, maxDeformation) {
    this.currentIntensity = Math.max(0, Math.min(1, deformation / (maxDeformation || 1)));
  }

  updateMoveVelocity(velocity) {
    const TH = 80, t = this.audioCtx.currentTime;
    if (velocity > TH) {
      const target = 0.2 + Math.min(1, velocity / 300) * 0.4;
      if (!this.stretchActive) {
        if (!this.buffers.stretch.length) return;
        const idx = Math.floor(Math.random() * this.buffers.stretch.length);
        const h = this._spawn(this.buffers.stretch[idx], { loop: true, gain: 0 });
        if (!h) return;
        this.stretchSource = h.src; this.stretchGain = h.gain;
        this.stretchGain.gain.cancelScheduledValues(t);
        this.stretchGain.gain.setValueAtTime(0, t);
        this.stretchGain.gain.linearRampToValueAtTime(target, t + 0.15);
        this.stretchActive = true;
      } else {
        this.stretchGain.gain.cancelScheduledValues(t);
        this.stretchGain.gain.linearRampToValueAtTime(target, t + 0.10);
      }
    } else if (this.stretchActive) {
      this.stretchGain.gain.cancelScheduledValues(t);
      this.stretchGain.gain.linearRampToValueAtTime(0, t + 0.3);
      const src = this.stretchSource;
      setTimeout(() => { try { src.stop(); } catch (e) {} }, 350);
      this.stretchActive = false; this.stretchSource = null; this.stretchGain = null;
    }
  }

  release() {
    this.pressing = false;
    if (this.pressTimer) { clearTimeout(this.pressTimer); this.pressTimer = null; }
    if (this.stretchActive && this.stretchGain) {
      const t = this.audioCtx.currentTime;
      this.stretchGain.gain.cancelScheduledValues(t);
      this.stretchGain.gain.linearRampToValueAtTime(0, t + 0.15);
      const src = this.stretchSource;
      setTimeout(() => { try { src.stop(); } catch (e) {} }, 200);
      this.stretchActive = false; this.stretchSource = null; this.stretchGain = null;
    }
    const pool = this.buffers.release;
    if (!pool.length) { this.currentIntensity = 0; return; }
    const idx = Math.floor(Math.random() * pool.length);
    this._spawn(pool[idx], { gain: 0.4 + this.currentIntensity * 0.5 });
    this.currentIntensity = 0;
  }

  setMasterVolume(v) {
    const c = Math.max(0, Math.min(1, v));
    const t = this.audioCtx.currentTime;
    this.master.gain.cancelScheduledValues(t);
    this.master.gain.linearRampToValueAtTime(c, t + 0.05);
  }

  setAmbientEnabled(on) {
    const t = this.audioCtx.currentTime;
    if (on) {
      if (this.ambientSource) return;
      if (!this.buffers.ambient.length) return;
      const h = this._spawn(this.buffers.ambient[0], { loop: true, gain: 0 });
      if (!h) return;
      this.ambientSource = h.src; this.ambientGain = h.gain;
      this.ambientGain.gain.setValueAtTime(0, t);
      this.ambientGain.gain.linearRampToValueAtTime(0.15, t + 1.0);
    } else {
      if (!this.ambientSource) return;
      this.ambientGain.gain.cancelScheduledValues(t);
      this.ambientGain.gain.linearRampToValueAtTime(0, t + 0.5);
      const src = this.ambientSource;
      setTimeout(() => { try { src.stop(); } catch (e) {} }, 600);
      this.ambientSource = null; this.ambientGain = null;
    }
  }

  stopAll() {
    this.pressing = false;
    if (this.pressTimer) { clearTimeout(this.pressTimer); this.pressTimer = null; }
    if (this.stretchSource) { try { this.stretchSource.stop(); } catch (e) {} }
    if (this.ambientSource) { try { this.ambientSource.stop(); } catch (e) {} }
    this.stretchSource = this.stretchGain = null; this.stretchActive = false;
    this.ambientSource = this.ambientGain = null;
  }
}

const RENDERERS = {
  blue: renderBlueSlime, poop: renderPoopSlime, cat: renderCatSlime,
  dog: renderDogSlime, sheep: renderSheepSlime, cake: renderCakeSlime,
  croissant: renderCroissantSlime, burger: renderBurgerSlime, donut: renderDonutSlime,
};

function renderSlime(id) {
  const def = SLIMES.find(s => s.id === id) || SLIMES[0];
  const slime = document.getElementById('slime');
  slime.innerHTML = '';
  slime.style.animation = 'none';
  void slime.offsetWidth;
  slime.style.animation = '';
  const fn = RENDERERS[id];
  slime.innerHTML = fn ? fn() : '';
}

function renderThumb(def) {
  return `<div class="thumb" style="
    background: radial-gradient(circle at 35% 30%, #FFFFFF, ${def.primary} 80%);
  "></div>`;
}

// =============================================================
// Engine + UI wiring
// =============================================================
const engine = new SlimeSoundEngine();
const $ = (id) => document.getElementById(id);

// Build selector
const track = $('selector-track');
SLIMES.forEach(def => {
  const btn = document.createElement('button');
  btn.className = 'pick' + (def.id === currentId ? ' selected' : '');
  btn.dataset.id = def.id;
  btn.setAttribute('aria-label', def.name);
  btn.innerHTML = renderThumb(def);
  btn.addEventListener('click', () => selectSlime(def.id));
  track.appendChild(btn);
});

function selectSlime(id) {
  if (id === currentId) return;
  currentId = id;
  document.querySelectorAll('.pick').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === id);
  });
  renderSlime(id);
}

// Render first
renderSlime(currentId);

// Preload sounds
(async () => {
  await engine.preloadAll();
  $('loading').classList.add('hidden');
  const ok = engine.loadStatus.filter(s => s.ok).length;
  const total = engine.loadStatus.length;
  const loadEl = $('s-load');
  if (ok === total) {
    loadEl.textContent = `✓ ${ok}/${total} 真实样本`;
    loadEl.className = 'status ok';
  } else {
    loadEl.textContent = `⚠ ${ok}/${total} 真实 · ${total - ok} 合成`;
    loadEl.className = 'status warn';
  }
})();

// ─── Press / Move / Release on slime ──────────────────────
const slimeEl = $('slime');
const groundEl = $('ground-shadow');
const MAX_DEF = 1.0;
const PRESS_RAMP_MS = 800;

let pressing = false;
let pressStart = 0;
let lastMove = { x: 0, y: 0, t: 0 };
let currentVel = 0;
let currentDef = 0;

function pointerPos(e) {
  const r = slimeEl.getBoundingClientRect();
  if (e.touches && e.touches[0]) {
    return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
  }
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function onDown(e) {
  e.preventDefault();
  engine.unlock();
  pressing = true;
  pressStart = performance.now();
  const p = pointerPos(e);
  lastMove = { x: p.x, y: p.y, t: pressStart };
  engine.startPressing();
}

function onMove(e) {
  if (!pressing) return;
  e.preventDefault();
  const p = pointerPos(e);
  const now = performance.now();
  const dt = (now - lastMove.t) / 1000;
  if (dt > 0.005) {
    const dx = p.x - lastMove.x, dy = p.y - lastMove.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    currentVel = dist / dt;
    engine.updateMoveVelocity(currentVel);
    lastMove = { x: p.x, y: p.y, t: now };
  }
}

function onUp(e) {
  if (!pressing) return;
  e && e.preventDefault && e.preventDefault();
  pressing = false;
  engine.release();
  currentVel = 0;
  engine.updateMoveVelocity(0);
}

slimeEl.addEventListener('pointerdown', onDown);
window.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);

// RAF — drive deformation + apply visual squish to slime + ground shadow
function tick() {
  if (pressing) {
    const t = performance.now() - pressStart;
    currentDef = Math.min(1, t / PRESS_RAMP_MS);
    engine.updatePressIntensity(currentDef * MAX_DEF, MAX_DEF);
  } else {
    currentDef = Math.max(0, currentDef - 0.08);
  }
  // Visual squish: scale down + ground shadow stretches horizontally
  const compress = 1 - currentDef * 0.12;
  const stretchX = 1 + currentDef * 0.22;
  slimeEl.style.transform = `scale(${compress})`;
  groundEl.style.transform = `translateX(-50%) scaleX(${stretchX})`;
  groundEl.style.opacity = 1 - currentDef * 0.25;

  if (performance.now() - lastMove.t > 80 && currentVel > 0) {
    currentVel *= 0.7;
    if (currentVel < 5) currentVel = 0;
    engine.updateMoveVelocity(currentVel);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ─── Top buttons ─────────────────────────────────────────
const btnSettings = $('btn-settings');
const btnAmbient = $('btn-ambient');
const btnMute = $('btn-mute');
const sheet = $('sheet');
const sheetBg = $('sheet-bg');

btnSettings.addEventListener('click', () => {
  sheet.classList.add('show');
  sheetBg.classList.add('show');
});
sheetBg.addEventListener('click', () => {
  sheet.classList.remove('show');
  sheetBg.classList.remove('show');
});

// Ambient toggle (both top button and settings toggle in sync)
let ambientOn = false;
function setAmbient(on) {
  ambientOn = on;
  engine.setAmbientEnabled(on);
  btnAmbient.classList.toggle('toggled', on);
  $('ambient-toggle').classList.toggle('on', on);
  $('ambient-status').textContent = on ? '开' : '关';
}
btnAmbient.addEventListener('click', () => setAmbient(!ambientOn));
$('ambient-toggle').addEventListener('click', () => setAmbient(!ambientOn));

// Mute toggle (preserve last volume; restore on unmute)
let muted = false;
let lastVolume = 0.7;
function setMute(m) {
  muted = m;
  btnMute.classList.toggle('toggled', m);
  // Visually swap mute icon waves
  document.getElementById('wave-1').style.display = m ? 'none' : '';
  document.getElementById('wave-2').style.display = m ? 'none' : '';
  if (m) {
    lastVolume = +$('master').value / 100;
    engine.setMasterVolume(0);
  } else {
    engine.setMasterVolume(lastVolume);
  }
}
btnMute.addEventListener('click', () => setMute(!muted));

// Master volume slider
$('master').addEventListener('input', (e) => {
  const pct = +e.target.value;
  $('master-val').textContent = pct + '%';
  if (muted) setMute(false);
  engine.setMasterVolume(pct / 100);
});

// Initial state
engine.setMasterVolume(+$('master').value / 100);
console.log('[slime] clay UI + sound engine ready.');
</script>
