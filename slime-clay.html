<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#FFF8F0" />
<title>Slime · Clay</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-top: #FFF8F0;
    --bg-bot: #FFE8D6;
    --surface: #FFFFFF;
    --surface-soft: #FFF1E0;
    --text: #5C4A3A;
    --text-soft: #A08775;
    --text-hint: #D4B8A0;
    --accent: #FFB088;
    --accent-hover: #FF9166;
    --success: #A8D5A0;
    --r-sm: 16px;
    --r-md: 24px;
    --r-lg: 32px;
    --r-full: 9999px;
    --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);

    /* Claymorphism shadow — every raised surface uses this */
    --clay:
      inset 0 4px 8px rgba(255, 255, 255, 0.55),
      inset 0 -4px 8px rgba(180, 140, 100, 0.15),
      0 12px 24px -4px rgba(180, 130, 90, 0.25),
      0 4px 8px -2px rgba(180, 130, 90, 0.15);
    --clay-pressed:
      inset 0 -4px 8px rgba(255, 255, 255, 0.4),
      inset 0 4px 10px rgba(180, 140, 100, 0.28),
      0 2px 4px -1px rgba(180, 130, 90, 0.18);
    --clay-strong:
      inset 0 6px 10px rgba(255, 255, 255, 0.65),
      inset 0 -5px 10px rgba(180, 140, 100, 0.18),
      0 16px 32px -4px rgba(180, 130, 90, 0.32),
      0 6px 12px -2px rgba(180, 130, 90, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    touch-action: none;
    overscroll-behavior: none;
  }
  body {
    font-family: 'Nunito', 'Quicksand', "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight: 600;
    color: var(--text);
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bot) 100%);
    user-select: none;
    -webkit-user-select: none;
  }
  /* Cream grain overlay — fixed paper-like dots, very subtle */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      radial-gradient(circle at 17% 23%, rgba(255,255,255,0.45) 1px, transparent 2px),
      radial-gradient(circle at 62% 71%, rgba(255,255,255,0.35) 1px, transparent 2px),
      radial-gradient(circle at 81% 12%, rgba(255,255,255,0.40) 1px, transparent 2px),
      radial-gradient(circle at 33% 82%, rgba(255,255,255,0.30) 1px, transparent 2px),
      radial-gradient(circle at 50% 47%, rgba(255,255,255,0.28) 1px, transparent 2px);
    background-size: 53px 53px, 67px 67px, 41px 41px, 73px 73px, 59px 59px;
    opacity: 0.45;
    pointer-events: none;
    z-index: 0;
    mix-blend-mode: overlay;
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }

  /* ─── Top bar ───────────────────────────────────────── */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 8px;
    gap: 12px;
  }
  .icon-btn {
    width: 48px; height: 48px;
    border-radius: var(--r-full);
    background: var(--surface);
    color: var(--text);
    border: none;
    display: grid; place-items: center;
    cursor: pointer;
    box-shadow: var(--clay);
    transition: transform 0.35s var(--ease-bounce), box-shadow 0.2s ease;
  }
  .icon-btn:active {
    transform: translateY(2px) scale(0.94);
    box-shadow: var(--clay-pressed);
  }
  .icon-btn svg {
    width: 22px; height: 22px;
    stroke-width: 2;
  }
  .top-spacer { flex: 1; }

  /* ─── Stage (slime area) ────────────────────────────── */
  .stage {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .stage-inner {
    position: relative;
    width: 280px; height: 280px;
    display: grid;
    place-items: center;
  }
  .ground-shadow {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 210px;
    height: 32px;
    background: radial-gradient(ellipse at center, rgba(180,130,90,0.35) 0%, rgba(180,130,90,0.18) 35%, transparent 70%);
    filter: blur(2px);
    pointer-events: none;
    transition: transform 0.35s var(--ease-bounce);
  }
  .slime {
    width: 280px; height: 280px;
    position: relative;
    display: grid; place-items: center;
    animation: enter 0.6s var(--ease-bounce);
  }
  .slime svg {
    width: 100%; height: 100%;
    overflow: visible;
    /* Warm-brown drop-shadow stack — matches the cream theme across all variants */
    filter:
      drop-shadow(0 14px 22px rgba(180, 130, 90, 0.32))
      drop-shadow(0 6px 10px rgba(180, 130, 90, 0.20));
  }
  @keyframes enter {
    0%   { transform: scale(0.7); opacity: 0; }
    60%  { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); }
  }

  /* ─── Bottom selector ───────────────────────────────── */
  .selector {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    padding: 18px 28px 22px;
    scrollbar-width: none;
  }
  .selector::-webkit-scrollbar { display: none; }
  .selector-track {
    display: inline-flex;
    gap: 14px;
    padding: 4px 2px;
  }
  .pick {
    flex-shrink: 0;
    width: 64px; height: 64px;
    border-radius: var(--r-full);
    background: var(--surface);
    border: none;
    cursor: pointer;
    scroll-snap-align: center;
    opacity: 0.72;
    position: relative;
    display: grid; place-items: center;
    overflow: visible;
    box-shadow: var(--clay);
    transition: transform 0.35s var(--ease-bounce), opacity 0.25s ease, box-shadow 0.25s ease;
  }
  .pick:active {
    transform: scale(0.94);
  }
  .pick.selected {
    opacity: 1;
    transform: scale(1.10);
    box-shadow:
      0 0 0 4px var(--accent),
      var(--clay-strong);
  }
  .pick .thumb {
    width: 44px; height: 44px;
    border-radius: var(--r-full);
    display: grid; place-items: center;
    font-size: 22px;
    line-height: 1;
    box-shadow:
      inset 0 3px 4px rgba(255,255,255,0.5),
      inset 0 -3px 5px rgba(180,140,100,0.18);
  }
  .pick .thumb svg { width: 30px; height: 30px; }
</style>
</head>
<body>

<main class="app">

  <header class="top">
    <button class="icon-btn" id="btn-settings" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>

    <div class="top-spacer"></div>

    <button class="icon-btn" id="btn-fav" aria-label="收藏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    </button>

    <button class="icon-btn" id="btn-mute" aria-label="静音">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="22" y1="9" x2="16" y2="15"/>
        <line x1="16" y1="9" x2="22" y2="15"/>
      </svg>
    </button>
  </header>

  <div class="stage">
    <div class="stage-inner">
      <div class="ground-shadow" id="ground-shadow"></div>
      <div class="slime" id="slime">
        <!-- First slime (#1 transparent blue) rendered here on init -->
      </div>
    </div>
  </div>

  <nav class="selector" id="selector">
    <div class="selector-track" id="selector-track">
      <!-- 9 picks populated by JS -->
    </div>
  </nav>

</main>

<script>
'use strict';

// ─── Slime catalog ─────────────────────────────────────────
// id, name (中文), and color palette (used for placeholder thumbs).
// SVG renderers will be added one at a time per the user's plan;
// only `blue` is rendered with detail for now.
const SLIMES = [
  { id: 'blue',      name: '透明蓝',  primary: '#A8D5F2', secondary: '#FFFFFF' },
  { id: 'poop',      name: '便便',    primary: '#A6753E', secondary: '#8B5A2A' },
  { id: 'cat',       name: '小猫',    primary: '#FFE0B5', secondary: '#FFB8C8' },
  { id: 'dog',       name: '小狗',    primary: '#F5DEB3', secondary: '#8B4513' },
  { id: 'sheep',     name: '小羊',    primary: '#FFFFFF', secondary: '#E8D5B7' },
  { id: 'cake',      name: '蛋糕',    primary: '#FFF5E1', secondary: '#FFB6C1' },
  { id: 'croissant', name: '可颂',    primary: '#E8B973', secondary: '#C8923D' },
  { id: 'burger',    name: '汉堡',    primary: '#E8B973', secondary: '#90C572' },
  { id: 'donut',     name: '甜甜圈',  primary: '#E8B973', secondary: '#FFB6C1' },
];

let currentId = SLIMES[0].id;

// ─── Center slime renderers ────────────────────────────────
// Only `blue` is fleshed out per the user's plan. Other ids fall
// through to a simple solid blob (uses primary/secondary colors) so
// the swap still works visually until each is designed.
const RENDERERS = {
  blue:      renderBlueSlime,
  poop:      renderPoopSlime,
  cat:       renderCatSlime,
  dog:       renderDogSlime,
  sheep:     renderSheepSlime,
  cake:      renderCakeSlime,
  croissant: renderCroissantSlime,
  burger:    renderBurgerSlime,
  donut:     renderDonutSlime,
};

function renderSlime(id) {
  const def = SLIMES.find(s => s.id === id) || SLIMES[0];
  const slime = document.getElementById('slime');
  slime.innerHTML = '';
  slime.style.animation = 'none';
  // Force reflow so the animation re-runs on every swap
  void slime.offsetWidth;
  slime.style.animation = '';
  const fn = RENDERERS[id];
  slime.innerHTML = fn ? fn() : renderPlaceholderSlime(def);
}

// #1 — 透明蓝:略带透明感,边缘水珠高光,内部小气泡
function renderBlueSlime() {
  return `
    <svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Main body fill: light translucent blue with white top highlight -->
        <radialGradient id="blue-body" cx="38%" cy="32%" r="70%">
          <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.92"/>
          <stop offset="35%" stop-color="#D4ECFB" stop-opacity="0.75"/>
          <stop offset="75%" stop-color="#A8D5F2" stop-opacity="0.62"/>
          <stop offset="100%" stop-color="#7CB9DD" stop-opacity="0.55"/>
        </radialGradient>
        <!-- Inner darkness ring for clay-like depth -->
        <radialGradient id="blue-depth" cx="50%" cy="55%" r="55%">
          <stop offset="0%"  stop-color="rgba(124,185,221,0)"/>
          <stop offset="85%" stop-color="rgba(80,140,190,0)"/>
          <stop offset="100%" stop-color="rgba(60,110,160,0.35)"/>
        </radialGradient>
        <!-- Inner bubble fill: subtle white -->
        <radialGradient id="bubble" cx="35%" cy="30%" r="80%">
          <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0.95"/>
          <stop offset="100%" stop-color="#E8F4FB" stop-opacity="0.6"/>
        </radialGradient>
      </defs>

      <!-- main blob -->
      <ellipse cx="140" cy="148" rx="120" ry="108" fill="url(#blue-body)"/>
      <!-- depth ring on lower half -->
      <ellipse cx="140" cy="160" rx="120" ry="108" fill="url(#blue-depth)"/>

      <!-- glossy top arc (specular streak) -->
      <ellipse cx="108" cy="82" rx="52" ry="11" fill="rgba(255,255,255,0.85)"/>
      <ellipse cx="92"  cy="75" rx="22" ry="5"  fill="rgba(255,255,255,0.95)"/>

      <!-- internal bubbles, varying size/opacity -->
      <circle cx="180" cy="125" r="9.5" fill="url(#bubble)"/>
      <circle cx="180" cy="125" r="4"   fill="#FFFFFF" opacity="0.9"/>
      <circle cx="115" cy="185" r="7"   fill="url(#bubble)"/>
      <circle cx="115" cy="185" r="3"   fill="#FFFFFF" opacity="0.85"/>
      <circle cx="168" cy="208" r="5.5" fill="url(#bubble)" opacity="0.9"/>
      <circle cx="95"  cy="145" r="4.5" fill="url(#bubble)" opacity="0.8"/>
      <circle cx="200" cy="175" r="3.5" fill="url(#bubble)" opacity="0.75"/>

      <!-- bottom edge wet droplet hint -->
      <ellipse cx="155" cy="245" rx="34" ry="6" fill="rgba(168,213,242,0.45)"/>
    </svg>`;
}

// #2 — 便便:可爱风,3 层叠加 + 大眼睛笑脸
function renderPoopSlime() {
  return `
    <svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="poop-body" cx="35%" cy="28%" r="75%">
          <stop offset="0%" stop-color="#E2B27C"/>
          <stop offset="45%" stop-color="#A6753E"/>
          <stop offset="100%" stop-color="#6E4824"/>
        </radialGradient>
        <radialGradient id="poop-hl" cx="50%" cy="18%" r="60%">
          <stop offset="0%"  stop-color="rgba(255,240,210,0.55)"/>
          <stop offset="100%" stop-color="rgba(255,240,210,0)"/>
        </radialGradient>
      </defs>
      <!-- bottom (widest) layer -->
      <ellipse cx="140" cy="215" rx="118" ry="46" fill="url(#poop-body)"/>
      <ellipse cx="125" cy="194" rx="48" ry="9" fill="url(#poop-hl)"/>
      <!-- middle layer -->
      <ellipse cx="140" cy="160" rx="92" ry="38" fill="url(#poop-body)"/>
      <ellipse cx="128" cy="140" rx="36" ry="8" fill="url(#poop-hl)"/>
      <!-- third layer -->
      <ellipse cx="140" cy="110" rx="66" ry="30" fill="url(#poop-body)"/>
      <ellipse cx="132" cy="93" rx="26" ry="6" fill="url(#poop-hl)"/>
      <!-- top tip -->
      <ellipse cx="140" cy="72" rx="36" ry="20" fill="url(#poop-body)"/>
      <ellipse cx="138" cy="60" rx="14" ry="4" fill="url(#poop-hl)"/>
      <!-- pointy tip -->
      <ellipse cx="140" cy="48" rx="14" ry="11" fill="url(#poop-body)"/>
      <ellipse cx="140" cy="42" rx="5" ry="2.5" fill="url(#poop-hl)"/>
      <!-- big eyes on middle layer -->
      <ellipse cx="118" cy="158" rx="13" ry="15" fill="#FFFFFF"/>
      <ellipse cx="162" cy="158" rx="13" ry="15" fill="#FFFFFF"/>
      <circle cx="120" cy="162" r="7" fill="#2A1810"/>
      <circle cx="164" cy="162" r="7" fill="#2A1810"/>
      <circle cx="122" cy="158" r="2.5" fill="#FFFFFF"/>
      <circle cx="166" cy="158" r="2.5" fill="#FFFFFF"/>
      <!-- happy smile -->
      <path d="M 120 178 Q 140 192 160 178" stroke="#2A1810" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    </svg>`;
}

// #3 — 小猫:奶油色 + 三角耳 + 闭眼笑脸 ^_^ + 腮红
function renderCatSlime() {
  return `
    <svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="cat-body" cx="38%" cy="30%" r="72%">
          <stop offset="0%"  stop-color="#FFF6E0"/>
          <stop offset="55%" stop-color="#FFE0B5"/>
          <stop offset="100%" stop-color="#D9B786"/>
        </radialGradient>
        <radialGradient id="cat-ear-in" cx="50%" cy="50%" r="60%">
          <stop offset="0%"  stop-color="#FFD3DD"/>
          <stop offset="100%" stop-color="#FFA8B8"/>
        </radialGradient>
      </defs>
      <!-- ears (outer) -->
      <path d="M 56 92 L 80 22 L 110 76 Z" fill="#D9B786"/>
      <path d="M 224 92 L 200 22 L 170 76 Z" fill="#D9B786"/>
      <!-- ears (inner pink) -->
      <path d="M 70 88 L 82 40 L 100 76 Z" fill="url(#cat-ear-in)"/>
      <path d="M 210 88 L 198 40 L 180 76 Z" fill="url(#cat-ear-in)"/>
      <!-- body -->
      <ellipse cx="140" cy="158" rx="118" ry="105" fill="url(#cat-body)"/>
      <ellipse cx="108" cy="100" rx="42" ry="9" fill="rgba(255,255,255,0.55)"/>
      <!-- closed-eye smiles ^_^ -->
      <path d="M 90 148 Q 108 134 126 148"  stroke="#2A1810" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 154 148 Q 172 134 190 148" stroke="#2A1810" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- blush -->
      <ellipse cx="78" cy="180" rx="15" ry="9" fill="#FFB8C8" opacity="0.78"/>
      <ellipse cx="202" cy="180" rx="15" ry="9" fill="#FFB8C8" opacity="0.78"/>
      <!-- nose (small pink triangle) -->
      <path d="M 134 178 L 146 178 L 140 187 Z" fill="#FF7E9B"/>
      <!-- three-petal mouth -->
      <path d="M 140 187 L 140 202" stroke="#2A1810" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M 140 202 Q 125 215 116 202" stroke="#2A1810" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M 140 202 Q 155 215 164 202" stroke="#2A1810" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <!-- whiskers -->
      <g stroke="rgba(120,90,60,0.55)" stroke-width="1.8" stroke-linecap="round">
        <line x1="60"  y1="195" x2="105" y2="195"/>
        <line x1="62"  y1="208" x2="105" y2="205"/>
        <line x1="175" y1="195" x2="220" y2="195"/>
        <line x1="175" y1="205" x2="218" y2="208"/>
      </g>
    </svg>`;
}

// #4 — 小狗:米色 + 棕垂耳 + 大眼睛 + 红舌头
function renderDogSlime() {
  return `
    <svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="dog-body" cx="38%" cy="30%" r="72%">
          <stop offset="0%"  stop-color="#FFF6DC"/>
          <stop offset="55%" stop-color="#F5DEB3"/>
          <stop offset="100%" stop-color="#D2B07A"/>
        </radialGradient>
        <radialGradient id="dog-ear" cx="40%" cy="25%" r="80%">
          <stop offset="0%"  stop-color="#A57440"/>
          <stop offset="100%" stop-color="#5C3A1A"/>
        </radialGradient>
        <radialGradient id="dog-tongue" cx="40%" cy="30%" r="70%">
          <stop offset="0%"  stop-color="#FF95A8"/>
          <stop offset="100%" stop-color="#D9445F"/>
        </radialGradient>
      </defs>
      <!-- floppy ears behind body -->
      <ellipse cx="58"  cy="120" rx="28" ry="58" fill="url(#dog-ear)" transform="rotate(-15 58 120)"/>
      <ellipse cx="222" cy="120" rx="28" ry="58" fill="url(#dog-ear)" transform="rotate(15 222 120)"/>
      <!-- body -->
      <ellipse cx="140" cy="158" rx="112" ry="102" fill="url(#dog-body)"/>
      <ellipse cx="108" cy="100" rx="40" ry="9" fill="rgba(255,255,255,0.55)"/>
      <!-- eyes (big round) -->
      <circle cx="108" cy="150" r="14" fill="#2A1810"/>
      <circle cx="172" cy="150" r="14" fill="#2A1810"/>
      <circle cx="113" cy="146" r="4.2" fill="#FFFFFF"/>
      <circle cx="177" cy="146" r="4.2" fill="#FFFFFF"/>
      <!-- nose: rounded triangle -->
      <path d="M 124 178 Q 140 172 156 178 Q 152 195 140 198 Q 128 195 124 178 Z" fill="#3A2614"/>
      <circle cx="135" cy="182" r="2.6" fill="rgba(255,255,255,0.55)"/>
      <!-- mouth + tongue line -->
      <path d="M 140 198 L 140 212" stroke="#2A1810" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <!-- tongue sticking out -->
      <ellipse cx="140" cy="228" rx="15" ry="13" fill="url(#dog-tongue)"/>
      <path d="M 140 218 L 140 238" stroke="rgba(140,40,55,0.5)" stroke-width="1.8" fill="none"/>
    </svg>`;
}

// #5 — 小羊:白色蓬松,周围云朵凸起 + 脸 + 黑色小圆眼
function renderSheepSlime() {
  return `
    <svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="sheep-wool" cx="38%" cy="28%" r="72%">
          <stop offset="0%"  stop-color="#FFFFFF"/>
          <stop offset="100%" stop-color="#E4E0D8"/>
        </radialGradient>
        <radialGradient id="sheep-face" cx="50%" cy="32%" r="70%">
          <stop offset="0%"  stop-color="#F5DDB6"/>
          <stop offset="100%" stop-color="#B89669"/>
        </radialGradient>
      </defs>

// ─── Selector thumbs ───────────────────────────────────────
// Each pick shows a tinted circle in the slime's primary color.
// Detailed mini-versions will replace these once each SVG is designed.
function renderThumb(def) {
  return `
    <div class="thumb" style="
      background: radial-gradient(circle at 35% 30%, #FFFFFF, ${def.primary} 80%);
    "></div>
  `;
}

// ─── Build selector + wire up ──────────────────────────────
const track = document.getElementById('selector-track');
SLIMES.forEach(def => {
  const btn = document.createElement('button');
  btn.className = 'pick' + (def.id === currentId ? ' selected' : '');
  btn.dataset.id = def.id;
  btn.setAttribute('aria-label', def.name);
  btn.innerHTML = renderThumb(def);
  btn.addEventListener('click', () => selectSlime(def.id));
  track.appendChild(btn);
});

function selectSlime(id) {
  if (id === currentId) return;
  currentId = id;
  document.querySelectorAll('.pick').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === id);
  });
  renderSlime(id);
  console.log('[slime-clay] selected:', id);
}

// ─── Top buttons (just log for now) ────────────────────────
document.getElementById('btn-settings').addEventListener('click', () => console.log('[slime-clay] settings clicked'));
document.getElementById('btn-fav').addEventListener('click', () => console.log('[slime-clay] favorites clicked'));
document.getElementById('btn-mute').addEventListener('click', () => console.log('[slime-clay] mute clicked'));

// ─── Init ──────────────────────────────────────────────────
renderSlime(currentId);
console.log('[slime-clay] scaffold ready. selected:', currentId);
</script>
